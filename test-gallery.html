<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Test - Baswabile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            color: #101B35;
            text-align: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .gallery-item {
            border: 3px solid #C9A45C;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .gallery-item p {
            padding: 10px;
            margin: 0;
            text-align: center;
            background: #C9A45C;
            color: white;
            font-weight: bold;
        }
        .status {
            text-align: center;
            padding: 20px;
            background: #C9A45C;
            color: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .error {
            background: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Baswabile Gallery Test</h1>
        <div class="status" id="status">Loading gallery images...</div>
        
        <div class="gallery" id="gallery">
            <!-- Images will be loaded here -->
        </div>
    </div>

    <script>
        const galleryImages = [
            { src: 'images/gallery/g1.png', name: 'G1', category: 'mobile-bars' },
            { src: 'images/gallery/g2.png', name: 'G2', category: 'events' },
            { src: 'images/gallery/g3.png', name: 'G3', category: 'cocktails' },
            { src: 'images/gallery/g4.png', name: 'G4', category: 'mobile-bars' },
            { src: 'images/gallery/g5.png', name: 'G5', category: 'events' },
            { src: 'images/gallery/Background.png', name: 'Background', category: 'mobile-bars' },
            { src: 'images/gallery/about.us.png', name: 'About Us', category: 'events' },
            { src: 'images/gallery/makeup&installation.webp', name: 'Makeup & Installation', category: 'events' }
        ];

        const gallery = document.getElementById('gallery');
        const status = document.getElementById('status');
        let loadedCount = 0;
        let errorCount = 0;

        galleryImages.forEach((image, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            const img = document.createElement('img');
            img.src = image.src;
            img.alt = image.name;
            
            img.onload = () => {
                loadedCount++;
                updateStatus();
            };
            
            img.onerror = () => {
                errorCount++;
                img.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250"%3E%3Crect fill="%23f5f5f5" width="300" height="250"/%3E%3Ctext x="50%25" y="50%25" font-family="Arial" font-size="16" fill="%23d32f2f" text-anchor="middle" dy=".3em"%3EERROR%3C/text%3E%3C/svg%3E';
                updateStatus();
            };
            
            const label = document.createElement('p');
            label.textContent = `${image.name} (${image.category})`;
            
            item.appendChild(img);
            item.appendChild(label);
            gallery.appendChild(item);
        });

        function updateStatus() {
            const total = galleryImages.length;
            if (loadedCount + errorCount === total) {
                if (errorCount === 0) {
                    status.textContent = `✅ SUCCESS! All ${loadedCount} images loaded perfectly!`;
                    status.className = 'status';
                } else {
                    status.textContent = `⚠️ ${loadedCount} images loaded, ${errorCount} failed to load`;
                    status.className = 'status error';
                }
            } else {
                status.textContent = `Loading... ${loadedCount}/${total} images loaded`;
            }
        }
    </script>
</body>
</html>
